# Data watchdog (Josh 2026-10-10: "I want to make sure that you and I are notified when failures occur for data imports").
# GitHub only emails about failed runs a person started; runs one workflow starts for another (the GFW chain) and silent
# non-runs (ships-counts never fired) told nobody. Every hour this:
#   1. opens (or adds to) one issue per data workflow whose recent runs failed, assigned to Josh (GitHub emails him),
#      and closes it with a note when that workflow's latest run succeeds again;
#   2. opens an issue when published data goes stale (GFW tracks, the /ships changelog numbers);
#   3. opens an issue when the aisstream recorder stops (live snapshot 20+ minutes old), closed when it records again.
# Issues carry the label "data-alert" so Claude sessions can list them too: gh issue list --label data-alert
#
# Failed-run issues (1) open UNASSIGNED and hand each new failure to failure-triage.yml (Josh 2026-11-04: one email per
# failure was too many). Triage re-runs blips, waits out upstream outages, and assigns Josh only when something needs
# him. Stale data (2) and a stopped recorder (3) are always real, so those still assign him straight away.
name: data-watchdog

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: write   # dispatches failure-triage.yml
  contents: read

concurrency:
  group: data-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/workflows }
      - name: Check failed runs and stale data
        run: |
          gh label create data-alert --color B60205 --description "Automatic: a data import failed or went stale" 2>/dev/null || true
          python3 - <<'EOF'
          import datetime as dt, glob, json, os, subprocess, urllib.request

          ASSIGNEE = 'jknauernever'
          SKIP = {'data-watchdog.yml', 'gisis-monthly-reminder.yml', 'failure-triage.yml'}
          BAD = {'failure', 'timed_out', 'startup_failure'}
          now = dt.datetime.now(dt.timezone.utc)

          def gh(*args):
              return subprocess.run(['gh', *args], check=True, capture_output=True, text=True).stdout

          # Every open alert, read once: GitHub's issue search doesn't see an issue created a moment ago, so searching per
          # alert opened a second issue for a workflow's second failure in the same run (2026-10-10, #10 + #11).
          OPEN = {i['title']: i for i in json.loads(gh('issue', 'list', '--label', 'data-alert', '--state', 'open', '--limit', '200',
                                                       '--json', 'number,title,body'))}

          def open_issue(title):
              return OPEN.get(title)

          def alert(title, lines, key, assign=True):
              """One open issue per title; a new comment only for news not already in it (key = run URL or check date).
              Returns the issue number when this call added news, else None."""
              iss = open_issue(title)
              # The key rides along as a hidden marker: stale-data keys ("stale-2026-10-30") never appeared in the text, so
              # the check below never matched and every hourly run commented again (an email each, 2026-11-05).
              text = '\n'.join(lines) + f'\n<!-- watchdog-key: {key} -->'
              if iss is None:
                  args = ['issue', 'create', '--title', title, '--label', 'data-alert', '--body', text]
                  url = gh(*args, *(['--assignee', ASSIGNEE] if assign else [])).strip()
                  n = int(url.rsplit('/', 1)[-1])
                  OPEN[title] = {'number': n, 'title': title, 'body': text}
                  print('opened:', title)
                  return n
              seen = iss['body'] + ''.join(c['body'] for c in json.loads(gh('issue', 'view', str(iss['number']), '--json', 'comments'))['comments'])
              if key not in seen:
                  gh('issue', 'comment', str(iss['number']), '--body', text)
                  iss['body'] += text
                  print('commented:', title)
                  return iss['number']
              return None

          def triage(issue, run_id):
              try:
                  gh('workflow', 'run', 'failure-triage.yml', '-f', f'issue={issue}', '-f', f'run_id={run_id}')
                  print('triage dispatched:', issue, run_id)
              except subprocess.CalledProcessError as e:   # triage unavailable: fall back to telling Josh directly
                  gh('issue', 'edit', str(issue), '--add-assignee', ASSIGNEE)
                  print('triage dispatch failed, assigned:', issue, e.stderr)

          def resolve(title, text):
              iss = open_issue(title)
              if iss:
                  gh('issue', 'close', str(iss['number']), '--comment', text)
                  OPEN.pop(title, None)
                  print('closed:', title)

          # 1. Failed runs, per data workflow
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              wf = os.path.basename(path)
              if wf in SKIP:
                  continue
              runs = json.loads(gh('run', 'list', '--workflow', wf, '--limit', '15', '--json',
                                   'databaseId,attempt,conclusion,status,createdAt,displayTitle,url,event'))
              # A re-run (triage's) in progress drops out of the completed list and an older success would read as
              # "recovered": leave this workflow's issue alone until the re-run finishes.
              if any(r['status'] != 'completed' and (r.get('attempt') or 1) > 1 for r in runs):
                  continue
              done = [r for r in runs if r['status'] == 'completed']
              if not done:
                  continue
              title = f'Data import failing: {wf}'
              recent_bad = [r for r in done if r['conclusion'] in BAD
                            and now - dt.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00')) < dt.timedelta(hours=48)]
              # Still failing = some run title (e.g. "ships-gfw-month 2026-10 (pacnw)": one workflow runs per month) whose
              # newest completed run is a failure. Recovered when every failing title has succeeded since.
              newest = {}
              for r in done:                       # gh lists newest first
                  newest.setdefault(r['displayTitle'], r)
              failing = [r for r in recent_bad if newest[r['displayTitle']]['conclusion'] in BAD]
              if not failing:
                  if recent_bad:
                      resolve(title, 'Recovered: ' + '; '.join(f'{t} succeeded {newest[t]["createdAt"]} {newest[t]["url"]}'
                                                               for t in sorted({r['displayTitle'] for r in recent_bad})))
                  else:
                      resolve(title, 'Recovered: no failed runs in the last 48 hours.')
                  continue
              for r in failing:
                  # The attempt is part of the key: a re-run that fails again is the same URL but is news (triage escalates it).
                  key = f'{r["url"]} (attempt {r.get("attempt") or 1})'
                  n = alert(title, [f'**{r["displayTitle"]}** {r["conclusion"]} at {r["createdAt"]} ({r["event"]})', key, '',
                                    'Opened by .github/workflows/data-watchdog.yml; failure-triage.yml reviews each failure and '
                                    'assigns Josh only if something needs doing. Closes itself when this workflow succeeds again.'],
                            key, assign=False)
                  if n:
                      triage(n, r['databaseId'])

          # 2. Stale published data
          def get(url):
              with urllib.request.urlopen(f'{url}?t={int(now.timestamp())}', timeout=60) as r:
                  return json.load(r)
          # The last field names the workflows (file-name prefixes) that publish the data. When one of them already has an
          # open failure alert, staleness is that failure's consequence: triage handles it there (and escalates outages after
          # 48 h), so the stale alert stays unassigned instead of emailing Josh a second time for the same cause.
          checks = [
              ('GFW ship tracks', 'https://fxj3imydg9misw9w.public.blob.vercel-storage.com/ships/tracks/gfw-v1/index.json',
               lambda d: d.get('fetched_through'), 6, 'newest GFW positions published', ('ships-gfw-',)),
              ('/ships changelog numbers', 'https://fxj3imydg9misw9w.public.blob.vercel-storage.com/ships/changelog-counts.json',
               lambda d: d.get('asOf'), 2, 'counts last refreshed', ('ships-counts.yml',)),
          ]
          failing_alerts = {t.split(': ', 1)[1]: i['number'] for t, i in OPEN.items() if t.startswith('Data import failing: ')}
          # A source its publisher has switched off: the bake opens this issue and skips its fetch while it lasts
          # (ships-gfw-tracks-bake.yml, GFW's pause of 2026-11-03), so its runs are green and staleness has no failing run
          # to point at. Same treatment as a failure cause: the stale alert names it and stays unassigned.
          PAUSES = {'GFW ship tracks': 'Data source paused: GFW per-vessel positions'}
          for name, url, pick, max_days, what, makers in checks:
              title = f'Data stale: {name}'
              cause = next(((wf, n) for wf, n in failing_alerts.items() if wf.startswith(makers)), None)
              pause = OPEN.get(PAUSES.get(name, ''))
              try:
                  day = pick(get(url))
                  age = (now.date() - dt.date.fromisoformat(day)).days
              except Exception as e:
                  alert(title, [f'Could not read {url}: {e}'], f'read-error-{now.date()}')
                  continue
              if age > max_days:
                  lines = [f'{what}: **{day}** ({age} days ago; alert after {max_days}).', url]
                  if cause:
                      lines.append(f'Caused by the open failure alert #{cause[1]} ({cause[0]}); that issue is where Josh gets told.')
                  elif pause:
                      lines.append(f'The source is paused by its publisher (#{pause["number"]}); nothing to fix here.')
                  alert(title, lines, f'stale-{day}', assign=not (cause or pause))
                  iss = open_issue(title)
                  if iss:   # follow the cause as it comes and goes (no-op edits make no notification)
                      gh('issue', 'edit', str(iss['number']), '--remove-assignee' if cause or pause else '--add-assignee', ASSIGNEE)
              else:
                  resolve(title, f'Fresh again: {what} {day}.')

          # 3. The aisstream recorder (Fly.io app earthatlas-aisstream, scripts/ships/aisstream): it rewrites the live snapshot
          #    every 60 s. Stale for 20+ minutes = not recording (machine down, aisstream outage, or uploads failing).
          title = 'Recording stopped: aisstream recorder (live AIS)'
          url = 'https://fxj3imydg9misw9w.public.blob.vercel-storage.com/ships/live/salish-v6.json'
          try:
              live = get(url)
              gen = dt.datetime.fromisoformat(live['generated'].replace('Z', '+00:00'))
              last = dt.datetime.fromisoformat(live['lastMessageAt'].replace('Z', '+00:00')) if live.get('lastMessageAt') else gen
              mins = int((now - min(gen, last)).total_seconds() // 60)
          except Exception as e:
              alert(title, [f'Could not read {url}: {e}'], f'read-error-{now.date()}-{now.hour}')
          else:
              if mins >= 20:
                  alert(title, [f'Newest live snapshot {live["generated"]}, last aisstream message {live.get("lastMessageAt")} '
                                f'(**{mins} minutes** ago; alert after 20). Ships seen in the last 24 h: {len(live.get("ships", []))}.', url, '',
                                'Check: `fly logs -a earthatlas-aisstream` and `fly status -a earthatlas-aisstream`; restart with '
                                '`fly apps restart earthatlas-aisstream`. Every minute without data is lost (aisstream keeps no history). '
                                'Closes itself when the snapshot is fresh again.'], f'stale-{gen.isoformat()}')
              else:
                  resolve(title, f'Recording again: live snapshot {live["generated"]}.')
          EOF

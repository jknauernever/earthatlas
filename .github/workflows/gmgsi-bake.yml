# Bakes NOAA's Global Mosaic of Geostationary Satellite Imagery into one global
# cloud image for the /inmotion Clouds layer.
#
# Lives in Actions for the same reason as liveocean-bake.yml: the bake is
# python (h5py opens NOAA's HDF5) and this project's Vercel preset is Vite,
# which won't build python functions in api/. The job downloads a 7 MB frame,
# resamples it and POSTs a ~1.6 MB WebP to the ingest endpoint — about a
# minute end to end.
#
# NOAA publishes each hourly frame roughly 35 minutes past the hour, so this
# runs at :45 to catch it with margin.
name: gmgsi-bake
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch: {}

concurrency:
  group: gmgsi-bake
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/gmgsi-requirements.txt
      - run: pip install -r scripts/gmgsi-requirements.txt
      - name: Bake global cloud mosaic
        run: python scripts/bake-gmgsi.py
        env:
          CLOUDS_INGEST_URL: https://earthatlas.org/api/cron/clouds-ingest
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

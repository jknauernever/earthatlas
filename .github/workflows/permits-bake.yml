# /permits weekly bake: re-reads every source (Army Corps permits + open public notices, EPA ECHO violations, Ecology
# PARIS documents, Ecology 303(d), DOH shellfish) and publishes to Blob permits/ (scripts/permits/publish.mjs), which
# earthatlas.org/permits reads. No commit, no Vercel build.
#
# Weekly because the Corps lists a public notice only while its comment period is open (about 30 days); each run
# archives any San Juan notice (data + PDF) for good. The archive lives on Blob and is pulled before every bake.
# publish.mjs refuses to replace the live data if the fresh bake lost much of it (an agency down, a feed changed).
# Uploads use one-file tokens from api/cron/permits-upload-token.js (CRON_SECRET), never a Blob token.
# After the bake, WDFW's HPA records for permits at spawning areas are re-read in headless Chrome (hpa-fetch.mjs; files
# cached between runs) and conditions + "needs review" re-attached (add-habitat.mjs). If WDFW can't be read, the run
# warns and publishes with the conditions last committed in data/permits/hpa-conditions.json. San Juan County SEPA
# reviews (sepa-fetch.mjs, plain GETs, record pages cached) are joined the same way.
name: permits-bake

on:
  schedule:
    - cron: '37 13 * * 1'   # Mondays 13:37 UTC (06:37 Pacific); GitHub may start it late
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Bake and gate only; upload nothing', type: boolean, default: false }

concurrency:
  group: permits-bake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PERMITS_TOKEN_URL: https://earthatlas.org/api/cron/permits-upload-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pull the Corps notice archive from Blob
        run: node scripts/permits/publish.mjs --pull
      - name: Bake
        run: node scripts/permits/bake-permits.mjs
      - name: Cache WDFW permit files and SEPA records
        uses: actions/cache@v4
        with:
          path: scripts/permits/cache
          key: permits-cache-${{ github.run_id }}
          restore-keys: permits-cache-
      - name: Read San Juan County SEPA reviews (Ecology SEPA Register)
        run: node scripts/permits/sepa-fetch.mjs || echo "::warning::SEPA Register read failed; publishing with the committed data/permits/county-sepa.json"
      - name: Read WDFW applications and permits (HPAs)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
          export CHROME_PATH=$(which google-chrome)
          # New San Juan applications since 2025 (each record read once, then kept in data/permits/hpa-applications.json).
          node scripts/permits/hpa-search.mjs --since 2025-01-01 \
            || echo "::warning::WDFW application search failed; publishing with the committed data/permits/hpa-applications.json"
          node scripts/permits/add-habitat.mjs
          node scripts/permits/hpa-fetch.mjs --refresh-lists \
            || echo "::warning::WDFW HPA read failed; publishing with the committed data/permits/hpa-conditions.json"
          node scripts/permits/add-habitat.mjs
      - name: Gate and publish
        run: node scripts/permits/publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

# Bakes /ships track lines from Global Fishing Watch HOURLY per-vessel positions for the waters
# NOAA doesn't cover (scripts/ships/bake-gfw/, docs/SHIP_TRACK_SOURCES.md "GFW hourly lines") and
# publishes them to Vercel Blob (ships/tracks/gfw-v1/), with an index the site reads at runtime.
#
#   weekly = the incremental mode, run DAILY by the cron below (or Run workflow → mode=weekly): every month touched by the days since the
#     index's fetched_through minus 5 (GFW revises recent days) up to 4 days ago is re-fetched WHOLE
#     and rebaked (raw reports are not kept between runs; pacnw ≈ 100 requests per month).
#   backfill (Run workflow → mode=backfill, from=2025-01): fetch and bake every month from `from`.
#   stage: which areas (areas.py): pacnw (BC + Alaska + Salish gap fill), us, world.
#
# GFW runs ONE report per user at a time, so fetching is serial (fetch matrix max-parallel 1, one
# month per job, ~30–40 min each for pacnw). As each month's fetch finishes it starts its own
# ships-gfw-month.yml run (route → tile → publish → index), so months go live one by one while
# the next month downloads (2026-10-01; before, a batch's months all waited for the slowest).
# PLANNED (Josh 2026-09-30): once the bulk backfill to date is done, change the incremental run to fetch ONLY the days
#   since the last update (+ the few days GFW may revise) and rebuild only the tiles those days touch, instead of
#   re-fetching and re-baking the whole current month every day.
# Uploads use one-file tokens from api/cron/ships-upload-token.js (CRON_SECRET), never a Blob token.
# Secrets: GFW_API_TOKEN (GFW API, server/CI only), CRON_SECRET (existing).
name: ships-gfw-tracks-bake
on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC (Josh 2026-09-30: daily updates; GFW data is ~4 days behind)
  workflow_dispatch:
    inputs:
      mode:
        description: 'weekly (new days + 5-day re-fetch) or backfill'
        type: choice
        options: [weekly, backfill]
        default: weekly
      stage:
        description: 'Area set (areas.py): pacnw | us | world'
        default: pacnw
      from:
        description: 'Backfill start month (YYYY-MM)'
        default: '2025-01'
      months:
        description: 'Optional: only these months (YYYY-MM list) — overrides the plan'
        default: ''

concurrency:
  group: ships-gfw-fetch       # one fetching run at a time (GFW: one report per user); month runs are separate
  cancel-in-progress: false

env:
  STAGE: ${{ github.event.inputs.stage || 'pacnw' }}
  GFW_INDEX: https://fxj3imydg9misw9w.public.blob.vercel-storage.com/ships/tracks/gfw-v1/index.json

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.plan.outputs.fetch }}     # [{month, from, to}]
      route: ${{ steps.plan.outputs.route }}     # [{month, group, areas}]
      months: ${{ steps.plan.outputs.months }}
      fetched_through: ${{ steps.plan.outputs.fetched_through }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          MODE: ${{ github.event.inputs.mode || 'weekly' }}
          FROM: ${{ github.event.inputs.from || '2025-01' }}
          ONLY: ${{ github.event.inputs.months || '' }}
        run: |
          cd scripts/ships/bake-gfw
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os, urllib.request
          import areas
          today = dt.date.today()
          last = today - dt.timedelta(days=4)                  # GFW lags ~4 days
          mode, stage = os.environ['MODE'], os.environ['STAGE']
          try:
              idx = json.load(urllib.request.urlopen(os.environ['GFW_INDEX'] + f'?t={today}'))
          except Exception:
              idx = {}
          if mode == 'backfill' or not idx.get('fetched_through'):
              start = dt.date.fromisoformat(os.environ['FROM'] + '-01')
          else:                                                  # weekly: new days + re-fetch the 5 before
              start = dt.date.fromisoformat(idx['fetched_through']) - dt.timedelta(days=5)
          months, d = [], start.replace(day=1)
          while d <= last:
              months.append(d.strftime('%Y-%m'))
              d = (d.replace(day=28) + dt.timedelta(days=4)).replace(day=1)
          if os.environ['ONLY'].strip():
              months = [m for m in os.environ['ONLY'].split() if m in months] or os.environ['ONLY'].split()
          fetch = []
          for m in months:
              a = dt.date.fromisoformat(m + '-01')              # whole month (raw is not kept between runs)
              nxt = (dt.date.fromisoformat(m + '-01').replace(day=28) + dt.timedelta(days=4)).replace(day=1)
              b = min(nxt, last + dt.timedelta(days=1))
              # through: the month whose window reaches `last` carries the index's new fetched_through (publish.mjs).
              # inc: incremental (daily) runs re-fetch only from here when the month's earlier downloads are in the Actions
              # cache (fetch job); otherwise the whole month (2026-10-02: Josh, only download the new days).
              inc = max(a, start).isoformat() if mode != 'backfill' and idx.get('fetched_through') else ''
              # keep: save the month's downloads for the daily runs that will re-fetch its last days (also after a backfill,
              # 2026-10-05: else the next daily run rebuilt the month from an older cache missing the backfilled areas).
              keep = 'true' if inc or m >= (last - dt.timedelta(days=7)).strftime('%Y-%m') else ''
              fetch.append(dict(month=m, through=last.isoformat() if b == last + dt.timedelta(days=1) else '', inc=inc, keep=keep, **{'from': a.isoformat(), 'to': b.isoformat()}))
          if mode == 'backfill':
              fetch.reverse()                                     # newest first: the most recent months appear first
          # Route groups: the whole stage in one group for pacnw/us; the world in ~30° longitude bands.
          tiles = areas.stage(stage)
          if stage == 'world':
              bands = {}
              for t in tiles:
                  bands.setdefault(f'band{int((t[1] + 180) // 30):02d}', []).append(t[0])
              groups = bands
          else:
              groups = {stage: [t[0] for t in tiles]}
          route = [dict(month=m, group=g, areas=','.join(a)) for m in months for g, a in groups.items()]
          print('fetch=' + json.dumps(fetch))
          print('route=' + json.dumps(route))
          print('months=' + json.dumps(months))
          print('fetched_through=' + last.isoformat())
          EOF
          cat "$GITHUB_OUTPUT"

  # Coastline + tidal-flats data, built ONCE per stage and cached (2026-10-01: every route job used to build it on a
  # cache miss, so three months hit Overpass at once and one failed). Runs beside the fetch jobs, so it adds no time.
  water:
    needs: plan
    if: needs.plan.outputs.months != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: read
    env:
      GFW_LAND_DIR: ${{ github.workspace }}/land
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Already built?
        id: have
        run: |
          n=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "gfw-water-v3-$STAGE" --json key --jq length)
          echo "built=$([ "$n" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Another run's water job already building it? Wait for that instead of hitting Overpass twice; if it ends
      # without a cache, build here (resuming its saved downloads).
      - name: Wait for another run that is building it
        id: wait
        if: steps.have.outputs.built != 'true'
        run: |
          for i in $(seq 1 330); do
            [ "$(gh cache list --repo "$GITHUB_REPOSITORY" --key "gfw-water-v3-$STAGE" --json key --jq length)" != "0" ] && { echo "built=true" >> "$GITHUB_OUTPUT"; exit 0; }
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ships-gfw-tracks-bake.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            [ "$busy" = "0" ] && break
            sleep 60
          done
          echo "built=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.have.outputs.built != 'true' && steps.wait.outputs.built != 'true'
        with: { python-version: '3.12' }
      - name: Install tools
        if: steps.have.outputs.built != 'true' && steps.wait.outputs.built != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gdal-bin osmium-tool
          pip install --quiet numpy scipy scikit-image shapely pyshp pillow
      # Overpass answers already downloaded survive a failed attempt, so a rerun resumes instead of starting over.
      - name: Restore tidal-flats downloads (earlier attempts)
        if: steps.have.outputs.built != 'true' && steps.wait.outputs.built != 'true'
        uses: actions/cache/restore@v4
        with:
          path: overpass-flats
          key: gfw-flats-raw-${{ env.STAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gfw-flats-raw-${{ env.STAGE }}-
      - name: Prepare coastline data (~25 min coastlines + a few min tidal flats)
        if: steps.have.outputs.built != 'true' && steps.wait.outputs.built != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/overpass-flats"
          cd scripts/ships/bake-gfw
          python3 prepare_water.py --sources "$RUNNER_TEMP/water-sources"
          # Tidal flats from Geofabrik extracts (minutes); the Overpass route (fetch_flats.py) took 3+ hours (2026-10-01).
          python3 fetch_flats_pbf.py --stage "$STAGE" --sources "$RUNNER_TEMP/geofabrik"
      - name: Keep tidal-flats downloads for a rerun
        if: always() && steps.have.outputs.built != 'true' && steps.wait.outputs.built != 'true'
        uses: actions/cache/save@v4
        with:
          path: overpass-flats
          key: gfw-flats-raw-${{ env.STAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save coastline data
        if: steps.have.outputs.built != 'true' && steps.wait.outputs.built != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            land/osm
            land/extras-v1.pkl
            land/flats-v1.pkl
          key: gfw-water-v3-${{ env.STAGE }}

  fetch:
    needs: plan
    if: needs.plan.outputs.months != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      actions: write            # to start ships-gfw-month.yml for each fetched month
    strategy:
      fail-fast: false
      max-parallel: 1          # GFW: one running report per user
      matrix:
        job: ${{ fromJson(needs.plan.outputs.fetch) }}
    env:
      GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
      GFW_RAW: ${{ github.workspace }}/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet numpy scipy scikit-image shapely pyshp pillow
      # The month's earlier downloads (daily runs): with them, only the days from `inc` are fetched again.
      - name: Restore ${{ matrix.job.month }}'s earlier downloads
        id: rawcache
        if: matrix.job.inc != ''
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: gfw-raw-${{ env.STAGE }}-${{ matrix.job.month }}-${{ github.run_id }}
          restore-keys: gfw-raw-${{ env.STAGE }}-${{ matrix.job.month }}-
      - name: Fetch ${{ matrix.job.month }} (${{ matrix.job.from }} → ${{ matrix.job.to }})
        run: |
          cd scripts/ships/bake-gfw
          if [ -n "${{ matrix.job.inc }}" ] && [ -n "${{ steps.rawcache.outputs.cache-matched-key }}" ]; then
            echo "incremental: keeping the downloads before ${{ matrix.job.inc }} (${{ steps.rawcache.outputs.cache-matched-key }})"
            python3 fetch.py --stage "$STAGE" --from "${{ matrix.job.inc }}" --to "${{ matrix.job.to }}" --drop-overlapping "${{ matrix.job.inc }}" --span 7 --raw "$GFW_RAW" --budget 20000
          else
            python3 fetch.py --stage "$STAGE" --from "${{ matrix.job.from }}" --to "${{ matrix.job.to }}" --span 7 --raw "$GFW_RAW" --budget 20000
          fi
      # Keep the month's downloads for tomorrow's run (only months a daily run will touch again), then drop older copies
      # of the same month so the cache holds one per month.
      - name: Keep ${{ matrix.job.month }}'s downloads for the next daily run
        if: matrix.job.keep != '' || matrix.job.through != ''
        uses: actions/cache/save@v4
        with:
          path: raw
          key: gfw-raw-${{ env.STAGE }}-${{ matrix.job.month }}-${{ github.run_id }}
      - name: Drop older copies of ${{ matrix.job.month }}'s downloads
        if: matrix.job.keep != '' || matrix.job.through != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="gfw-raw-$STAGE-${{ matrix.job.month }}-$GITHUB_RUN_ID"
          gh cache list --repo "$GITHUB_REPOSITORY" --key "gfw-raw-$STAGE-${{ matrix.job.month }}-" --json key --jq '.[].key' \
            | while read -r k; do [ "$k" != "$keep" ] && gh cache delete "$k" --repo "$GITHUB_REPOSITORY" || true; done
      - name: Traffic raster for ${{ matrix.job.month }} (distinct vessels per 0.01° cell)
        env:
          GFW_LAND_DIR: ${{ github.workspace }}/land
        run: cd scripts/ships/bake-gfw && python3 bake.py traffic --stage "$STAGE" --months "${{ matrix.job.month }}"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.job.month }}
          path: raw
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-${{ matrix.job.month }}
          path: land/traffic-v1
          retention-days: 7
      # Route + tile + publish this month in its own run, right away, while the next month downloads (2026-10-01:
      # batches left GFW idle for hours between them). That run reads this run's artifacts.
      - name: Start routing and publishing ${{ matrix.job.month }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ships-gfw-month.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f month="${{ matrix.job.month }}" -f stage="$STAGE" -f source_run="$GITHUB_RUN_ID" -f through="${{ matrix.job.through }}"

  traffic-cache:
    needs: [plan, fetch]
    if: always() && needs.fetch.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: land/traffic-v1
          key: gfw-traffic-v1-${{ github.run_id }}
          restore-keys: gfw-traffic-v1-
      - uses: actions/download-artifact@v4
        with:
          pattern: traffic-*
          path: land/traffic-v1
          merge-multiple: true
      - name: Save the merged per-month traffic rasters for the next run
        uses: actions/cache/save@v4
        with:
          path: land/traffic-v1
          key: gfw-traffic-v1-${{ github.run_id }}

# Bakes US-wide /ships tracks from NOAA MarineCadastre AIS (CC0) and publishes
# them to Vercel Blob (scripts/ships/bake-us/).
#
# Run by hand: Actions → ships-us-tracks-bake → Run workflow, with months as a
# list ("2026-06 2026-05") and/or ranges ("2015-01..2026-06"). One job per month,
# up to 10 at a time, newest first:
#   - months with a NOAA monthly track file (2024-01 → 2025-12, ~1.6 GB) build
#     from it (build_us_tracks.py);
#   - other months build tracks from the daily position files (~10 GB/month,
#     build_us_points.py).
# Each job uploads its month with one-file tokens from api/cron/ships-upload-token.js
# (CRON_SECRET). The final job adds every finished month to
# ships/tracks/us-v2/index.json in ONE write, so parallel jobs never race on the
# index. A failed month is simply left out of the index.
name: ships-us-tracks-bake
on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Months: YYYY-MM list and/or YYYY-MM..YYYY-MM ranges (daily data 2015-01 → 2026-06)'
        required: true
        default: '2026-06'
      skip_existing:
        description: 'Skip months already in the index'
        type: boolean
        default: true

concurrency:
  group: ships-us-tracks-bake
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.plan.outputs.months }}
    steps:
      - id: plan
        env:
          MONTHS: ${{ github.event.inputs.months }}
          SKIP: ${{ github.event.inputs.skip_existing }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, sys, urllib.request
          out = []
          for tok in os.environ["MONTHS"].split():
              m = re.fullmatch(r"(20\d\d)-(0[1-9]|1[0-2])(?:\.\.(20\d\d)-(0[1-9]|1[0-2]))?", tok)
              if not m: sys.exit(f"bad month: {tok}")
              y, mo = int(m[1]), int(m[2]); y2, mo2 = (int(m[3]), int(m[4])) if m[3] else (y, mo)
              while (y, mo) <= (y2, mo2):
                  out.append(f"{y}-{mo:02d}"); y, mo = (y + 1, 1) if mo == 12 else (y, mo + 1)
          out = sorted(set(out), reverse=True)  # newest first
          if os.environ.get("SKIP") == "true":
              try:
                  idx = json.load(urllib.request.urlopen("https://fxj3imydg9misw9w.public.blob.vercel-storage.com/ships/tracks/us-v2/index.json"))
                  out = [m for m in out if m not in idx.get("months", {})]
              except Exception as e:
                  print(f"no index yet ({e})", file=sys.stderr)
          print("months=" + json.dumps(out))
          EOF
          cat "$GITHUB_OUTPUT"

  bake:
    needs: plan
    if: needs.plan.outputs.months != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SHIPS_TOKEN_URL: https://earthatlas.org/api/cron/ships-upload-token
      M: ${{ matrix.month }}
    steps:
      - name: Free disk (daily files are staged, ~5 GB/month)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyarrow shapely numpy duckdb
      - name: Restore tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-tilejoin-2.79.0-${{ runner.os }}
      - name: Build tippecanoe 2.79.0
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/
      - run: echo "$HOME/tippecanoe-bin" >> "$GITHUB_PATH"

      - name: Bake ${{ matrix.month }}
        run: |
          set -e
          if curl -sfI "https://ocmgeodatastor1.blob.core.windows.net/marinecadastre/aistrack/ais-track-$M.parquet" > /dev/null; then
            echo "monthly track file → build_us_tracks.py"
            python3 scripts/ships/bake-us/build_us_tracks.py "$M" "$RUNNER_TEMP/ships-$M"
          else
            echo "no monthly track file → daily positions, build_us_points.py"
            python3 scripts/ships/bake-us/build_us_points.py "$M" "$RUNNER_TEMP/ships-$M"
          fi
      - name: Upload ${{ matrix.month }} to Blob
        run: |
          mkdir -p "$RUNNER_TEMP/entries"
          node scripts/ships/bake-us/publish.mjs "$M" "$RUNNER_TEMP/ships-$M" --entry-out "$RUNNER_TEMP/entries/$M.json"
      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.month }}
          path: ${{ runner.temp }}/entries/${{ matrix.month }}.json
          retention-days: 7

  index:
    needs: bake
    if: always() && needs.bake.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SHIPS_TOKEN_URL: https://earthatlas.org/api/cron/ships-upload-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: entry-*
          path: entries
      - name: Add finished months to the index (one write)
        run: node scripts/ships/bake-us/publish.mjs --index entries

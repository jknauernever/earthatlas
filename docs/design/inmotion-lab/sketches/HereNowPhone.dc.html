<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In Motion: Here, Now on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E16}
a{color:#7FD3EC}a:hover{color:#B5E7F5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0E16; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

<div style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px; flex: none">
<span style="font-size: 11px; letter-spacing: 0.14em; color: #9AA6B8">EARTHATLAS · HERE, NOW</span>
<div style="display: flex; gap: 8px">
<label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 24px; border: 1px solid #2E3B4E; background: #121A26; color: #9AA6B8">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search for a place</span>
<input type="text" value="San Juan Islands, WA" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #E8ECF2; font-size: 15px; font-family: inherit">
</label>
<button type="button" aria-label="Use my location" style="width: 48px; height: 48px; flex: none; border-radius: 24px; border: 1px solid #2E3B4E; background: #121A26; color: #E8ECF2; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
</button>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{places}}" as="p" hint-placeholder-count="5">
<button type="button" style="{{p.style}}">{{p.name}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #121A26; border: 1px solid #233041; border-radius: 10px; padding: 4px">
<button type="button" onClick="{{showList}}" aria-pressed="{{listOn}}" style="{{listStyle}}">List</button>
<button type="button" onClick="{{showGlobe}}" aria-pressed="{{globeOn}}" style="{{globeStyle}}">Globe</button>
</div>
</div>

<sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: #0D1520; border: 1px solid #1E2A3A">
<svg width="56" height="56" viewBox="0 0 640 640" aria-hidden="true"><circle cx="320" cy="320" r="300" fill="#10243A" stroke="#2A4A66" stroke-width="8"></circle><path d="M300 120 C 380 110, 460 170, 480 260 C 500 360, 440 470, 360 520 C 330 540, 320 480, 330 430 C 340 380, 290 340, 300 280 Z" fill="#1A2B3D"></path><circle cx="296" cy="300" r="40" fill="#F2B544"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px">Around the San Juan Islands</span>
<span style="font-size: 12px; color: #9AA6B8">Within 50 km · updated [time]</span>
</div>
</div>
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{showGlobe}}" style="text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; min-height: 72px; border-radius: 12px; border: 1px solid #2A3647; background: #121A26; color: #E8ECF2; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 11px; letter-spacing: 0.12em; color: #9AA6B8">{{t.group}} · {{t.name}}</span>
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 21px">{{t.value}}</span>
<span style="font-size: 12px; color: {{t.noteColor}}">{{t.note}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6B8" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isGlobe}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; position: relative; overflow: hidden">
<svg width="420" height="420" viewBox="0 0 640 640" role="img" aria-label="Globe zoomed toward the Salish Sea showing sea temperature" style="position: absolute; left: -15px; top: 10px">
<defs><radialGradient id="gh" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#14304A"></stop><stop offset="100%" stop-color="#08131F"></stop></radialGradient></defs>
<circle cx="320" cy="320" r="300" fill="url(#gh)" stroke="#2A4A66" stroke-width="2"></circle>
<path d="M300 120 C 380 110, 460 170, 480 260 C 500 360, 440 470, 360 520 C 330 540, 320 480, 330 430 C 340 380, 290 340, 300 280 C 305 230, 270 160, 300 120 Z" fill="#1A2B3D"></path>
<g fill="none" stroke="#F2B36B" stroke-width="10" stroke-linecap="round" opacity="0.55"><path d="M120 300 C 180 290, 240 300, 290 300"></path><path d="M110 360 C 180 350, 240 350, 300 340"></path></g>
<circle cx="296" cy="300" r="12" fill="#F2B544" stroke="#0A0E16" stroke-width="4"></circle>
</svg>
<div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px">
<button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border: 1px solid #2A3647; border-radius: 10px; background: rgba(18,26,38,0.92); color: #E8ECF2; font-size: 20px; cursor: pointer">+</button>
<button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border: 1px solid #2A3647; border-radius: 10px; background: rgba(18,26,38,0.92); color: #E8ECF2; font-size: 20px; cursor: pointer">−</button>
</div>
<section aria-label="Selected layer" style="position: absolute; left: 12px; right: 12px; bottom: 16px; box-sizing: border-box; background: rgba(16,23,34,0.96); border: 1px solid #2A3647; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 12px; letter-spacing: 0.12em; color: #C9D2DE">SEA TEMPERATURE</span>
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px">[temp] °F</span>
</div>
<div style="height: 8px; border-radius: 4px; background: linear-gradient(90deg,#2A3F8A,#3E8FB8,#9FE0D0,#F2E37A,#D6463F)"></div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Play past 30 days" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 20px; background: #F2B544; color: #1A1206; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></button>
<label style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #9AA6B8"><span>30 days ago to now</span><input type="range" min="0" max="30" value="30" style="width: 100%; accent-color: #F2B544"></label>
</div>
<span style="font-size: 11px; color: #9AA6B8">Source: [dataset] · [date]</span>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { mode: 'list' }; }
  renderVals() {
    const isList = this.state.mode === 'list';
    const seg = on => 'min-height: 40px; border: 0; border-radius: 7px; font-size: 13px; cursor: pointer; background: ' + (on ? '#DCE6F2' : 'transparent') + '; color: ' + (on ? '#0A0E16' : '#C9D2DE');
    const place = (name, on) => ({ name, style: 'flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; border: 1px solid ' + (on ? '#F2B544' : '#2A3647') + '; background: ' + (on ? 'rgba(242,181,68,0.14)' : 'transparent') + '; color: ' + (on ? '#F7D48C' : '#C9D2DE') });
    const warm = '#F7B26B', calm = '#9AA6B8';
    return { isList, isGlobe: !isList, listOn: isList ? 'true' : 'false', globeOn: isList ? 'false' : 'true',
      listStyle: seg(isList), globeStyle: seg(!isList),
      showList: () => this.setState({ mode: 'list' }), showGlobe: () => this.setState({ mode: 'globe' }),
      places: [place('Salish Sea', true), place('Gulf of Mexico'), place('Amazon'), place('Great Barrier Reef'), place('Whole planet')],
      tiles: [
        { group: 'WATER', name: 'Sea temperature', value: '[temp] °F', note: '[x] °F warmer than normal', noteColor: warm },
        { group: 'AIR', name: 'Wind', value: '[speed] mph [dir]', note: 'Typical for this week', noteColor: calm },
        { group: 'AIR', name: 'Fine particles', value: '[PM2.5] µg/m³', note: '[category]', noteColor: calm },
        { group: 'WATER', name: 'Ocean acidity', value: 'pH [value]', note: 'Copernicus + UW LiveOcean', noteColor: calm },
        { group: 'LAND', name: 'Fires and quakes', value: '[n] fires · [n] quakes', note: 'Fires past 24 h, quakes past 30 days', noteColor: calm },
        { group: 'LIFE', name: 'Bird migration', value: '[level] tonight', note: 'Radar-observed', noteColor: calm }
      ] };
  }
}
</script>
</body>
</html>

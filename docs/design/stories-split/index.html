<style>
body{margin:0;background:#040C14}
a{color:#9FE3EE}a:hover{color:#D6F5FA}
button{font-family:inherit}
.ea-stage{--u:min(1vw,1.72vh)}
@keyframes eaShimmer{to{stroke-dashoffset:-72}}
.ea-shimmer{stroke-dasharray:1.5 10.5;animation:eaShimmer 7s linear infinite}
@keyframes eaPulse{0%,100%{opacity:.55}50%{opacity:1}}
.ea-pulse{animation:eaPulse 3.4s ease-in-out infinite}
@keyframes eaFlow{to{stroke-dashoffset:-36}}
.ea-flow{stroke-dasharray:5 7;animation:eaFlow 1.8s linear infinite}
@keyframes eaRiseA{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
@keyframes eaRiseB{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
.ea-riseA{animation:eaRiseA .8s cubic-bezier(.2,.7,.2,1) both}
.ea-riseB{animation:eaRiseB .8s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.map{position:absolute;top:-4%;right:0;height:100%;aspect-ratio:2000/1143;transform-origin:81% 72.3%;transition:transform 2.4s cubic-bezier(.65,0,.2,1)}
.map.zoom{transform:translate(-6%,-20%) scale(4.2)}
.rail-bar{display:block;height:3px;border-radius:2px;transition:background .5s ease;background:rgba(255,255,255,0.28)}
.rail-bar.done{background:rgba(255,255,255,0.75)}
.rail-bar.now{background:#FFE7A3}
.rail-text{font-size:max(11px, calc(var(--u) * 0.8));letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.8);color:rgba(255,255,255,0.7)}
.rail-text.now{color:#FFE7A3}
</style>

   "spawn": 1,
   "ck": 0.8,
   "armor": 0.35,
   "box": 0,
   "detail": 0
  },
  "zoom": 0,
  "cta": 1
 }
];
const stage = document.querySelector('.ea-stage'), map = document.getElementById('map');
let ch = 0, auto = false;
function render(){
  const C = CH[ch], N = CH.length;
  const f = {kicker: C.kicker, title: C.title, body: C.body, stat: C.stat, unit: C.unit, statLabel: C.statLabel, cap: C.cap};
  document.querySelectorAll('[data-f]').forEach(e => { e.textContent = f[e.dataset.f]; });
  const L = Object.assign({labels: C.zoom ? 0 : 1}, C.layers);
  for (const k in L) stage.style.setProperty('--L-' + k, L[k]);
  CH.forEach((c, i) => stage.style.setProperty('--pv-' + i, i === ch ? 1 : 0));
  map.classList.toggle('zoom', !!C.zoom);
  const cond = {hasStat: !!C.stat, isCta: !!C.cta, notEnd: ch < N - 1, atEnd: ch === N - 1};
  document.querySelectorAll('[data-if]').forEach(e => { e.style.display = cond[e.dataset.if] ? 'contents' : 'none'; });
  document.querySelectorAll('[data-go]').forEach(b => { const k = +b.dataset.go;
    b.setAttribute('aria-current', k === ch ? 'step' : 'false');
    b.querySelector('.rail-bar').className = 'rail-bar' + (k < ch ? ' done' : k === ch ? ' now' : '');
    b.querySelector('.rail-text').className = 'rail-text' + (k === ch ? ' now' : ''); });
  document.querySelectorAll('[data-rise]').forEach(e => { e.className = ch % 2 ? 'ea-riseA' : 'ea-riseB'; });
  const a = document.getElementById('auto'); a.textContent = auto ? 'Pause' : 'Play story'; a.setAttribute('aria-pressed', auto);
}
function go(i){ ch = Math.max(0, Math.min(CH.length - 1, i)); try { history.replaceState(null, '', '#chapter-' + (ch + 1)); } catch (e) {} render(); }
const acts = {next: () => go(ch + 1), prev: () => go(ch - 1), restart: () => go(0),
  toggleAuto: () => { auto = !auto; if (auto && ch === CH.length - 1) ch = 0; render(); }};
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'), a = e.target.closest('[data-act]');
  if (g) go(+g.dataset.go); else if (a) acts[a.dataset.act](); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(ch + 1); if (e.key === 'ArrowLeft') go(ch - 1); });
setInterval(() => { if (auto) { if (ch < CH.length - 1) go(ch + 1); else { auto = false; render(); } } }, 6500);
function fromHash(){ const m = /^#chapter-(\d)$/.exec(location.hash); if (m) ch = Math.max(0, Math.min(CH.length - 1, m[1] - 1)); render(); }
window.addEventListener('hashchange', fromHash); fromHash();
</script>
</body>

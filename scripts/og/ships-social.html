<div class="t"><h1>Ships</h1><div class="h">The open record of every ship.</div><div class="sub">Where it’s sailed, what it’s burned, and the impact it may leave behind.</div></div>
<script>
const NS='http://www.w3.org/2000/svg',el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
let sd=11;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const T=document.getElementById('T');
// Catmull-Rom sampler
function sample(P,n){const out=[];for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;out.push([0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}out.push(P[P.length-1]);return out}
function jit(P,a){return P.map(q=>[q[0]+(R()-.5)*a,q[1]+(R()-.5)*a])}
// lanes through the strait (west→east and east→west), plus coastal & fishing
const lanes=[
 [[380,420],[560,360],[700,300],[820,285],[940,280],[1060,275],[1220,270]],
 [[1220,300],[1080,300],[950,305],[830,310],[700,330],[560,400],[420,500]],
 [[430,120],[560,170],[690,230],[810,280],[930,290],[1050,290],[1220,285]],
 [[1220,255],[1070,258],[1015,200]],
];
const ships=[];
for(let i=0;i<34;i++){const L=lanes[Math.floor(R()*lanes.length)];const pts=sample(jit(L,26),10);
 const end=Math.floor(pts.length*(.25+R()*.75)),len=Math.floor(8+R()*26);ships.push({pts:pts.slice(Math.max(0,end-len),end),c:R()<.15?'#67e8f9':'#22d3ee',w:1.3})}
// highlighted voyage: long track, yellow, through strait into port
const hi=sample([[260,580],[380,520],[500,450],[620,380],[740,320],[860,300],[960,295],[1000,250],[1015,200]],12);
ships.push({pts:hi.slice(0,-6),c:'#fde047',w:3,hi:true});
for(const s of ships){const p=s.pts;if(p.length<2)continue;
 const d='M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
 if(s.hi)el('path',{d,fill:'none',stroke:s.c,'stroke-width':8,'stroke-opacity':.25,filter:'url(#gl)'},T);
 el('path',{d,fill:'none',stroke:s.c,'stroke-width':s.w,'stroke-opacity':s.hi?.95:.45,'stroke-linecap':'round'},T);
 p.forEach((q,i)=>{if(i%(s.hi?4:3))return;el('circle',{cx:q[0],cy:q[1],r:s.hi?3.2:1.7,fill:s.c,'fill-opacity':(.25+.75*i/p.length).toFixed(2)},T)});
 const a=p[p.length-2],b=p[p.length-1],ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
 const g=el('g',{transform:`translate(${b[0]},${b[1]}) rotate(${ang}) scale(${s.hi?1.5:.85})`},T);
 if(s.hi){el('circle',{r:16,fill:'none',stroke:s.c,'stroke-opacity':.45},g);el('circle',{r:28,fill:'none',stroke:s.c,'stroke-opacity':.2},g)}
 el('path',{d:'M10 0 L-7 -6 L-3.5 0 L-7 6 Z',fill:s.c,stroke:'#050b14','stroke-width':1},g);}
const tip=ships[ships.length-1].pts.slice(-1)[0];
el('path',{d:`M${tip[0]} ${tip[1]} L${tip[0]} 318 L900 318 L900 330`,fill:'none',stroke:'#fde047','stroke-width':1.4,'stroke-dasharray':'4 4','stroke-opacity':.8},T);
</script></body></html>
